server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTThatShouldBeAtLeast256BitsForHS256Algorithm}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 2592000000 # 30 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}
